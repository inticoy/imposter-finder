# 배그·FC·롤 친구전 리포트. cron-job.org가 15분마다 workflow_dispatch로 실행한다
# (GitHub 자체 schedule은 늦거나 빠지고, 활동 없는 공개 레포에선 60일 뒤 꺼진다).
name: find-imposter

on:
  workflow_dispatch:

# 한 번에 하나만: 겹쳐 돌면 같은 경기를 두 번 올린다. 대기 중이던 실행은 다음 실행으로 대체된다
concurrency:
  group: find-imposter
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # 지난 상태 캐시 지우기

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONITOR_ENDPOINT: ${{ secrets.MONITOR_ENDPOINT }}
      MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
      MONITOR_SERVICE: imposter-finder
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      MONITOR_ENABLED_GAMES: pubg,fc,lol # TFT intentionally disabled until key approval
      # 경기 기록 백업 (Cloudflare D1). 토큰 시크릿이 없으면 백업 단계는 건너뛴다
      D1_API_TOKEN: ${{ secrets.D1_API_TOKEN }}
      D1_ACCOUNT_ID: a51470d420404dcfb05995ed38876e83
      D1_DATABASE_ID: dc26c4a5-c7ad-4a97-bd2b-5988392379e4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      # 상태(DB·FC 메타)는 매번 바뀌어 새 키로 저장하고 가장 최근 것을 복원한다.
      # 캐시가 사라져도 첫 실행은 기록만 하고 올리지 않아 중복 리포트는 없다
      - name: Restore state
        uses: actions/cache/restore@v6
        with:
          path: |
            data/imposter_finder.db
            data/fc_meta
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-

      # 캐시가 지워졌으면 D1 백업에서 이어 받는다. 넥슨·라이엇은 최근 기록만 다시 주니 통산 기록을 지킨다
      - name: Restore state from D1
        if: env.D1_API_TOKEN != '' && hashFiles('data/imposter_finder.db') == ''
        run: python -m imposter_finder.backup pull

      # 이미지 캐시는 거의 그대로라 내용이 바뀔 때만 저장한다
      - name: Restore image cache
        id: assets
        uses: actions/cache/restore@v6
        with:
          path: data/assets
          key: assets-
          restore-keys: assets-

      - name: Write config
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          PLAYERS_JSON: ${{ secrets.PLAYERS_JSON }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env
          printf '%s\n' "$PLAYERS_JSON" > players.json

      - name: Collect and report
        env:
          BOT_ENV: prod
          PYTHONUNBUFFERED: "1"
        run: python -m imposter_finder collect

      # WAL에만 남은 기록까지 DB 파일 하나로 합친 뒤 저장한다 (캐시는 .db 파일만 담는다)
      - name: Checkpoint state
        if: always() && hashFiles('data/imposter_finder.db') != ''
        run: python -c "import sqlite3; db = sqlite3.connect('data/imposter_finder.db'); db.execute('PRAGMA wal_checkpoint(TRUNCATE)'); db.close()"

      - name: Save state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            data/imposter_finder.db
            data/fc_meta
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      # 로컬에만 있는 행을 D1에 더한다 (지우지 않아 빈 DB로 돌아도 백업은 안전하다)
      - name: Back up records to D1
        if: always() && env.D1_API_TOKEN != '' && hashFiles('data/imposter_finder.db') != ''
        run: python -m imposter_finder.backup push

      - name: Save image cache
        if: always() && hashFiles('data/assets/**') != '' && steps.assets.outputs.cache-matched-key != format('assets-{0}', hashFiles('data/assets/**'))
        uses: actions/cache/save@v6
        with:
          path: data/assets
          key: assets-${{ hashFiles('data/assets/**') }}

      # 캐시는 레포당 10GB: 최근 것만 남긴다
      - name: Prune old caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for prefix in state- assets-; do
            gh cache list --repo "$GITHUB_REPOSITORY" --key "$prefix" --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' |
              xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
          done

      - name: Report workflow status and heartbeat
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python scripts/monitor_workflow.py
