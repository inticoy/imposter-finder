# 배그·FC·롤 친구전 리포트. cron-job.org가 15분마다 workflow_dispatch로 실행한다
# (GitHub 자체 schedule은 늦거나 빠지고, 활동 없는 공개 레포에선 60일 뒤 꺼진다).
name: find-imposter

on:
  workflow_dispatch:

# 한 번에 하나만: 겹쳐 돌면 같은 경기를 두 번 올린다. 대기 중이던 실행은 다음 실행으로 대체된다
concurrency:
  group: find-imposter
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # 지난 상태 캐시 지우기

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MONITOR_ENDPOINT: ${{ secrets.MONITOR_ENDPOINT }}
      MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
      MONITOR_SERVICE: imposter-finder
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      MONITOR_ENABLED_GAMES: pubg,fc,lol # TFT intentionally disabled until key approval
      # 상태 DB 백업 (Cloudflare R2). 시크릿이 없으면 백업 단계는 건너뛴다
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: imposter-finder-state
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      # 상태(DB·FC 메타)는 매번 바뀌어 새 키로 저장하고 가장 최근 것을 복원한다.
      # 캐시가 사라져도 첫 실행은 기록만 하고 올리지 않아 중복 리포트는 없다
      - name: Restore state
        uses: actions/cache/restore@v6
        with:
          path: |
            data/imposter_finder.db
            data/fc_meta
          key: state-${{ github.run_id }}
          restore-keys: state-

      # 캐시가 지워졌으면 R2 백업에서 이어 받는다. 넥슨·라이엇은 30일치만 다시 주니 통산 기록을 지킨다
      - name: Restore state from R2
        if: env.R2_ENDPOINT != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          if [ -f data/imposter_finder.db ]; then exit 0; fi
          mkdir -p data
          if aws s3api head-object --bucket "$R2_BUCKET" --key state/latest.db --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
            aws s3 cp "s3://$R2_BUCKET/state/latest.db" data/imposter_finder.db --endpoint-url "$R2_ENDPOINT"
            echo "R2 백업에서 상태 복원"
          else
            echo "R2 백업 없음 — 새로 시작"
          fi

      # 이미지 캐시는 거의 그대로라 내용이 바뀔 때만 저장한다
      - name: Restore image cache
        id: assets
        uses: actions/cache/restore@v6
        with:
          path: data/assets
          key: assets-
          restore-keys: assets-

      - name: Write config
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          PLAYERS_JSON: ${{ secrets.PLAYERS_JSON }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env
          printf '%s\n' "$PLAYERS_JSON" > players.json

      - name: Collect and report
        env:
          BOT_ENV: prod
          PYTHONUNBUFFERED: "1"
        run: python -m imposter_finder collect

      - name: Save state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            data/imposter_finder.db
            data/fc_meta
          key: state-${{ github.run_id }}

      # latest.db는 매번 덮어쓰고, 하루 하나씩 날짜별 사본을 남긴다 (2MB대라 1년에 1GB 미만).
      # 복원에 실패해 빈 DB로 돌았을 때 좋은 백업을 덮어쓰지 않게, 크게 작아진 DB는 latest에 올리지 않는다
      - name: Back up state to R2
        if: always() && env.R2_ENDPOINT != '' && hashFiles('data/imposter_finder.db') != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          python - <<'PY'
          import sqlite3
          src, dst = sqlite3.connect("data/imposter_finder.db"), sqlite3.connect("/tmp/state.db")
          src.backup(dst)  # WAL까지 반영된 일관된 사본
          dst.close(); src.close()
          PY
          local=$(stat -c %s /tmp/state.db)
          remote=$(aws s3api head-object --bucket "$R2_BUCKET" --key state/latest.db --endpoint-url "$R2_ENDPOINT" \
            --query ContentLength --output text 2>/dev/null || echo 0)
          if [ "$remote" != "0" ] && [ "$local" -lt $(( remote * 8 / 10 )) ]; then
            aws s3 cp /tmp/state.db "s3://$R2_BUCKET/state/suspect/${{ github.run_id }}.db" --endpoint-url "$R2_ENDPOINT"
            echo "::warning::DB가 백업보다 크게 작다 ($local < $remote bytes) — latest를 덮어쓰지 않음"
            exit 0
          fi
          aws s3 cp /tmp/state.db "s3://$R2_BUCKET/state/latest.db" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp /tmp/state.db "s3://$R2_BUCKET/state/daily/$(TZ=Asia/Seoul date +%F).db" --endpoint-url "$R2_ENDPOINT"

      - name: Save image cache
        if: always() && hashFiles('data/assets/**') != '' && steps.assets.outputs.cache-matched-key != format('assets-{0}', hashFiles('data/assets/**'))
        uses: actions/cache/save@v6
        with:
          path: data/assets
          key: assets-${{ hashFiles('data/assets/**') }}

      # 캐시는 레포당 10GB: 최근 것만 남긴다
      - name: Prune old caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for prefix in state- assets-; do
            gh cache list --repo "$GITHUB_REPOSITORY" --key "$prefix" --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' |
              xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
          done

      - name: Report workflow status and heartbeat
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python scripts/monitor_workflow.py
